
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your SMH Collection account password.">
  <title>Reset Password | SMH Collection</title>
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <header class="auth-header">
    <a href="index.html" class="auth-logo" aria-label="SMH Collection Home">
      <span class="auth-logo-main">SMH</span>
      <span class="auth-logo-sub">COLLECTION</span>
    </a>
    <a href="index.html" class="back-home">← Home</a>
  </header>

  <main class="auth-page">
    <section class="auth-card" aria-labelledby="resetTitle">
      <div class="auth-heading">
        <p class="auth-eyebrow">ACCOUNT SECURITY</p>
        <h1 id="resetTitle">Create a new password</h1>
        <p>Choose a new password for your SMH Collection account.</p>
      </div>

      <form id="resetPasswordForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            autocomplete="new-password"
            minlength="8"
            placeholder="At least 8 characters"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmNewPassword">Confirm New Password</label>
          <input
            type="password"
            id="confirmNewPassword"
            autocomplete="new-password"
            minlength="8"
            placeholder="Enter your password again"
            required
          >
        </div>

        <div
          id="resetMessage"
          class="auth-message"
          role="status"
          aria-live="polite"
        ></div>

        <button type="submit" class="auth-button" id="resetButton">
          Update Password
        </button>
      </form>

      <p class="auth-switch">
        Remember your password?
        <a href="login.html">Sign In</a>
      </p>
    </section>
  </main>

  <footer class="auth-footer">
    <p>
      © <span id="currentYear"></span>
      SMH Collection. All rights reserved.
    </p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/reset-password.js"></script>
</body>
</html>
