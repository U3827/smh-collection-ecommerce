<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SMH Collection — Discover fashion, lifestyle, electronics and everyday essentials from a modern global marketplace."
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <meta
        name="author"
        content="SMH Collection"
    >

    <title>SMH Collection — Shop Everything You Love</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >
</head>

<body>

    <div id="app">

        <!-- ================================
             GLOBAL ANNOUNCEMENT
        ================================= -->

        <div
            id="announcement-bar"
            aria-label="Store announcement"
        ></div>


        <!-- ================================
             MAIN HEADER
        ================================= -->

        <header
            id="site-header"
            role="banner"
        ></header>


        <!-- ================================
             APPLICATION CONTENT
        ================================= -->

        <main
            id="main-content"
            role="main"
        ></main>


        <!-- ================================
             GLOBAL FOOTER
        ================================= -->

        <footer
            id="site-footer"
            role="contentinfo"
        ></footer>


        <!-- ================================
             GLOBAL UI CONTAINERS
        ================================= -->

        <div id="modal-root"></div>

        <div id="toast-root"></div>

        <div id="loader-root"></div>

    </div>


    <!--
        SMH Collection application entry point.
        All major application logic will be
        loaded through the JavaScript architecture.
    -->

    <script
        type="module"
        src="assets/js/app.js"
    ></script>

</body>
</html>
