<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sign In | SMH Collection</title>

  <meta
    name="description"
    content="Sign in to your SMH Collection account."
  >

  <link
    rel="stylesheet"
    href="assets/css/auth.css"
  >

</head>

<body>

  <!-- ================================
       AUTH HEADER
  ================================= -->

  <header class="auth-header">

    <a
      href="index.html"
      class="auth-logo"
      aria-label="SMH Collection Home"
    >

      <span class="auth-logo-main">
        SMH
      </span>

      <span class="auth-logo-sub">
        COLLECTION
      </span>

    </a>

    <a
      href="index.html"
      class="back-home"
    >
      ← Home
    </a>

  </header>


  <!-- ================================
       LOGIN
  ================================= -->

  <main class="auth-page">

    <section
      class="auth-card"
      aria-labelledby="loginTitle"
    >

      <div class="auth-heading">

        <p class="auth-eyebrow">
          WELCOME BACK
        </p>

        <h1 id="loginTitle">
          Sign in to your account
        </h1>

        <p>
          Sign in to continue to your
          SMH Collection account.
        </p>

      </div>


      <!-- ==============================
           LOGIN FORM
      =============================== -->

      <form
        id="loginForm"
        class="auth-form"
        novalidate
      >

        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            maxlength="254"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <!-- OPTIONS -->

        <div class="form-options">

          <label class="remember-me">

            <input
              type="checkbox"
              id="rememberMe"
              name="rememberMe"
            >

            <span>
              Remember me
            </span>

          </label>


          <button
            type="button"
            class="forgot-password"
            id="forgotPassword"
          >
            Forgot password?
          </button>

        </div>


        <!-- MESSAGE -->

        <div
          id="authMessage"
          class="auth-message"
          aria-live="polite"
          role="status"
        ></div>


        <!-- SUBMIT -->

        <button
          type="submit"
          class="auth-button"
          id="loginButton"
        >
          Sign In
        </button>

      </form>


      <!-- ==============================
           GOOGLE
      =============================== -->

      <div class="auth-divider">
        <span>OR</span>
      </div>


      <button
        type="button"
        class="google-button"
        id="googleSignIn"
      >

        <span
          class="google-icon"
          aria-hidden="true"
        >
          G
        </span>

        <span>
          Continue with Google
        </span>

      </button>


      <!-- ==============================
           SIGN UP LINK
      =============================== -->

      <p class="auth-switch">

        Don't have an account?

        <a href="signup.html">
          Create Account
        </a>

      </p>

    </section>

  </main>


  <!-- ================================
       FOOTER
  ================================= -->

  <footer class="auth-footer">

    <p>
      © <span id="currentYear"></span>
      SMH Collection. All rights reserved.
    </p>

  </footer>


  <!-- ================================
       SCRIPTS
  ================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="assets/js/supabase.js"></script>

  <script src="assets/js/auth.js"></script>

</body>
</html>
